# CI for herdr-reach.
#
# The gates are the ones `openspec/config.yaml` declares: `go test ./...` (the
# strict-TDD runner), `go vet ./...` (quality.typecheck) and `gofmt -l .`
# (quality.format). No linter is wired, because `quality.lint` is deliberately
# empty — choosing one is a decision, not a default to guess at.
#
# Only `Unit Tests` is a required status check in the branch ruleset, and it
# refuses to run when the format job failed: a guard that cannot block a merge is
# decoration, and a required check that goes green through a *skipped* dependency
# is worse than no check at all. The other jobs exist to make the expensive
# questions visible without putting them on the merge's critical path.
#
# There is deliberately no `concurrency` block: cancelling a superseded run can
# leave a required check cancelled, which reads as blocked rather than as
# superseded.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Manual re-run for a commit that is otherwise ready.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-format:
    name: Go Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Require gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-formatted:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    needs: go-format
    # `always()` keeps this job in the required-check set even when the format job
    # failed; the first step then turns that into an explicit failure instead of a
    # silent skip.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful Go format
        run: |
          if [ "${{ needs.go-format.result }}" != "success" ]; then
            echo "::error::the Go Format job did not succeed (${{ needs.go-format.result }})"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Typecheck
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...

  race:
    # The probe runner is concurrent by design (bounded worker pool, per-probe
    # deadlines, a run budget and cancellation), so a data race there is a
    # correctness bug rather than a performance footnote.
    name: Race Detector
    needs: go-format
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful Go format
        run: |
          if [ "${{ needs.go-format.result }}" != "success" ]; then
            echo "::error::the Go Format job did not succeed (${{ needs.go-format.result }})"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Test under the race detector
        run: go test -race -count=1 ./...

  platform-tests:
    # The tool runs on Linux, macOS and Windows and refuses only *native Windows
    # nodes*, so all three hosts are legitimate platforms for the test suite. Kept
    # off the required path on purpose: the Linux leg is the gate, these legs are
    # the evidence that a platform-specific assumption did not creep in.
    name: Platform Tests (${{ matrix.os }})
    needs: go-format
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Require successful Go format
        run: |
          if [ "${{ needs.go-format.result }}" != "success" ]; then
            echo "::error::the Go Format job did not succeed (${{ needs.go-format.result }})"
            exit 1
          fi
        shell: bash
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Typecheck
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      # Issue #81's measurement, run on the real macOS runner in both build
      # variants: the first step uses the toolchain's default flags, the second
      # the CGO_ENABLED=0 the release builds with. `go test -run` exits 0 when
      # its selector matches nothing, so each step greps its own output for the
      # run header and fails when the measurement did not run — the same guard
      # the no-egress job uses for the same reason.
      - name: Measure the macOS trust store (toolchain defaults)
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          selector='^TestDarwinTrustStoreMeasurement$'
          out="$(go test -count=1 -v ./internal/probe/ -run "$selector" 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '=== RUN   TestDarwinTrustStoreMeasurement' || {
            echo "::error::the selector matched no test: the trust-store measurement did not run"
            exit 1
          }
      - name: Measure the macOS trust store (CGO_ENABLED=0)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: |
          set -o pipefail
          selector='^TestDarwinTrustStoreMeasurement$'
          out="$(go test -count=1 -v ./internal/probe/ -run "$selector" 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '=== RUN   TestDarwinTrustStoreMeasurement' || {
            echo "::error::the selector matched no test: the trust-store measurement did not run"
            exit 1
          }
      # Issue #82's platform table records macOS as compiled, cross-built and
      # tested by CI but never measured against a real network, and the release
      # notes will quote that table. This step is the measurement, run on the
      # real macOS runner with the release's own build shape (CGO_ENABLED=0) so
      # what is measured and what ships cannot drift apart. `--hub` is absent by
      # design: CI has no hub to measure, so `egress.hub.direct` reports
      # `input_missing_hub`, nothing is claimed about the hub, and no
      # hub-dependent transport is decided by this run.
      #
      # The exit code is printed rather than asserted on, and that is the reading
      # a later editor must not "improve" into a gate: exit 0 is a completed
      # measurement and exit 1 is an incomplete one — a probe was attempted and
      # produced no answer — and an incomplete run is exactly the honest result
      # this evidence records. Only a status outside that contract fails the
      # step: exit 2 is the documented usage or internal error, and a run that
      # produced no diagnosis cannot stand as evidence.
      - name: "Real-network run on macOS (release evidence, issue #82)"
        if: runner.os == 'macOS'
        run: |
          echo "=== herdr-reach real-network run: evidence for the v0.1.0 platform table (issue #82) ==="
          echo "commit: $GITHUB_SHA"
          echo "platform: $RUNNER_OS/$RUNNER_ARCH ($(uname -srm))"
          echo "hub: deliberately absent — CI has no hub to measure, so egress.hub.direct reports input_missing_hub; nothing is claimed about the hub, and no hub-dependent transport is decided by this run"
          echo

          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/herdr-reach" ./cmd/herdr-reach

          # One doctor invocation: its whole output, both streams, is captured
          # and printed in full, and its exit code is printed beside it. The
          # function treats 0 and 1 as results, never as failures; a status
          # outside the contract stops the step.
          run_doctor() {
            local label="$1"
            shift
            local status=0
            local output
            output="$("$RUNNER_TEMP/herdr-reach" doctor "$@" 2>&1)" || status=$?
            printf '\n=== %s ===\n' "$label"
            printf '%s\n' "$output"
            printf '[doctor exit code: %s]\n' "$status"
            if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
              echo "::error::doctor exited $status: the run produced no diagnosis, so it cannot stand as evidence"
              exit 1
            fi
          }

          run_doctor "doctor (human report)"
          run_doctor "doctor --json (machine-readable document; human report on stderr too)" --json

  cross-build:
    # The release builds binaries for these platforms; compiling for each of them
    # catches a platform-specific import or build tag before packaging does.
    name: Cross-Build
    needs: go-format
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Require successful Go format
        run: |
          if [ "${{ needs.go-format.result }}" != "success" ]; then
            echo "::error::the Go Format job did not succeed (${{ needs.go-format.result }})"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  no-egress-guard:
    # The product's whole credibility rest depends on tests never touching the
    # real network, and the mechanism is a deny-all seam set that every probe test
    # starts from. That guarantee is only as strong as the tests that prove the
    # sentinel still denies, so this job fails when those tests are missing or
    # renamed away — the failure mode `go test -run` cannot report on its own,
    # because a selector matching nothing exits 0.
    name: No-Real-Network Guard
    needs: go-format
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful Go format
        run: |
          if [ "${{ needs.go-format.result }}" != "success" ]; then
            echo "::error::the Go Format job did not succeed (${{ needs.go-format.result }})"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Require the deny-all default to be proven
        run: |
          set -o pipefail
          selector='TestDenyAllSeams|TestNoPackageLevelSeamVariable'
          out="$(go test -count=1 -v ./internal/probe/ -run "$selector" 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out" | grep -q 'no tests to run' && {
            echo "::error::the selector matched no test: the guard is not running"
            exit 1
          }
          passed="$(printf '%s\n' "$out" | grep -c '^--- PASS' || true)"
          if [ "$passed" -lt 2 ]; then
            echo "::error::expected at least 2 passing sentinel tests, saw $passed — a renamed or removed test silently disables this guard"
            printf '%s\n' "$out"
            exit 1
          fi
          printf 'sentinel tests passing: %s\n' "$passed"
