<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="How herdr-reach works. The hub and the locked-down node cannot reach each other directly over SSH, so the node dials outbound to the Cloudflare edge and the hub consumes that tunnel. Because the two machines cannot talk yet, the pairing happens out of band: the hub emits a PairingBundle and the node answers with a NodeReceipt, neither containing a secret, both verified by fingerprint.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box    { fill: #1f2335; stroke: #3b4261; stroke-width: 1.5; }
    .title  { fill: #e0c15a; font-size: 20px; font-weight: 700; }
    .os     { fill: #565f89; font-size: 12px; }
    .item   { fill: #a9b1d6; font-size: 13px; }
    .sep    { stroke: #24283b; stroke-width: 1; }
    .good   { stroke: #b7cc85; stroke-width: 2.5; fill: none; }
    .goodtx { fill: #b7cc85; font-size: 12px; }
    .bad    { stroke: #cb7c94; stroke-width: 2; stroke-dasharray: 7 6; }
    .badtx  { fill: #cb7c94; }
  </style>

  <rect x="0" y="0" width="1200" height="700" rx="18" fill="#1a1b26"/>
  <rect x="0.75" y="0.75" width="1198.5" height="698.5" rx="17.25" fill="none" stroke="#3b4261" stroke-width="1.5"/>

  <text class="mono" x="56" y="52" font-size="27" font-weight="700" fill="#e0c15a">How it works</text>
  <text class="sans" x="56" y="80" font-size="15" fill="#565f89">Two roles, one artifact, and no inbound port anywhere.</text>

  <!-- cloudflare edge -->
  <rect x="470" y="104" width="260" height="86" rx="12" fill="#1f2335" stroke="#7fb4ca" stroke-width="1.5"/>
  <text class="mono" x="600" y="138" font-size="17" fill="#7fb4ca" text-anchor="middle">Cloudflare edge</text>
  <text class="sans" x="600" y="160" font-size="12" fill="#565f89" text-anchor="middle">named tunnel &#183; Access</text>
  <text class="sans" x="600" y="178" font-size="11" fill="#565f89" text-anchor="middle">service token &#183; no inbound port</text>

  <!-- real path -->
  <path class="good" d="M 985 250 V 147 H 732"/>
  <polygon points="744,141 744,153 732,147" fill="#b7cc85"/>
  <path class="good" d="M 468 147 H 215 V 248"/>
  <polygon points="209,238 221,238 215,250" fill="#b7cc85"/>
  <text class="mono goodtx" x="858" y="170" text-anchor="middle">outbound QUIC / 443</text>
  <text class="mono goodtx" x="340" y="170" text-anchor="middle">cloudflared access</text>

  <!-- hub -->
  <rect class="box" x="70" y="250" width="290" height="190" rx="12"/>
  <text class="mono title" x="94" y="288">hub</text>
  <text class="sans os" x="94" y="308">Linux / macOS</text>
  <line class="sep" x1="94" y1="324" x2="336" y2="324"/>
  <text class="sans item" x="94" y="348">herdr client + saved machines</text>
  <text class="sans item" x="94" y="370">forwarder service (user unit)</text>
  <text class="sans item" x="94" y="392">~/.ssh/config entry</text>
  <text class="sans item" x="94" y="414">runs herdr machine add</text>

  <!-- node -->
  <rect class="box" x="840" y="250" width="290" height="190" rx="12"/>
  <text class="mono title" x="864" y="288">node</text>
  <text class="sans os" x="864" y="308">Linux / macOS / WSL2</text>
  <line class="sep" x1="864" y1="324" x2="1106" y2="324"/>
  <text class="sans item" x="864" y="348">sshd &#8212; key only</text>
  <text class="sans item" x="864" y="370">cloudflared &#8212; pinned, http2</text>
  <text class="sans item" x="864" y="392">keepalive + watchdog</text>
  <text class="sans item" x="864" y="414">your projects, your agents</text>

  <!-- blocked direct link -->
  <line class="bad" x1="364" y1="345" x2="836" y2="345"/>
  <line x1="592" y1="337" x2="608" y2="353" stroke="#cb7c94" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="608" y1="337" x2="592" y2="353" stroke="#cb7c94" stroke-width="2.5" stroke-linecap="round"/>
  <text class="mono badtx" x="600" y="322" font-size="13" text-anchor="middle">direct SSH &#8212; blocked</text>
  <text class="sans" x="600" y="372" font-size="12" fill="#565f89" text-anchor="middle">the destination is blocked, not the protocol</text>

  <!-- out of band -->
  <rect x="70" y="490" width="1060" height="160" rx="12" fill="none" stroke="#e0c15a" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.65"/>
  <text class="mono" x="600" y="520" font-size="15" fill="#e0c15a" text-anchor="middle">out of band &#8212; you carry this</text>

  <line x1="180" y1="566" x2="998" y2="566" stroke="#7fb4ca" stroke-width="2"/>
  <polygon points="1012,566 1000,560 1000,572" fill="#7fb4ca"/>
  <text class="mono" x="600" y="556" font-size="13" fill="#7fb4ca" text-anchor="middle">PairingBundle &#160;&#183;&#160; public key, nonce, expected transport</text>

  <line x1="1020" y1="614" x2="202" y2="614" stroke="#957fb8" stroke-width="2"/>
  <polygon points="188,614 200,608 200,620" fill="#957fb8"/>
  <text class="mono" x="600" y="604" font-size="13" fill="#957fb8" text-anchor="middle">NodeReceipt &#160;&#183;&#160; public key, platform, measured evidence</text>

  <text class="sans" x="600" y="640" font-size="11" fill="#565f89" text-anchor="middle">neither artifact contains a secret &#183; the fingerprint is displayed on both sides</text>
</svg>
