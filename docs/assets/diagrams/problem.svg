<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Measured TCP reachability from a corporate laptop: SSH to github.com on port 22 succeeds, SSH over 443 succeeds, but every port to the user's own hub is blocked, while the Cloudflare tunnel edge on 7844 and 443 is reachable and TLS is not intercepted. The conclusion: SSH works, the destination is blocked, and the tunnel edge is reachable.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .head { fill: #565f89; font-size: 12px; letter-spacing: 1.4px; }
    .tgt  { fill: #c0caf5; font-size: 14px; }
    .port { fill: #7fb4ca; font-size: 14px; }
    .mean { fill: #a9b1d6; font-size: 13px; }
    .ok   { font-size: 12px; fill: #b7cc85; }
    .bad  { font-size: 12px; fill: #cb7c94; }
    .rule { stroke: #24283b; stroke-width: 1; }
  </style>

  <rect x="0" y="0" width="1200" height="640" rx="18" fill="#1a1b26"/>
  <rect x="0.75" y="0.75" width="1198.5" height="638.5" rx="17.25" fill="none" stroke="#3b4261" stroke-width="1.5"/>

  <text class="mono" x="56" y="54" font-size="27" font-weight="700" fill="#e0c15a">The failure looks like something else</text>
  <text class="sans" x="56" y="82" font-size="15" fill="#565f89">Measured from the corporate laptop that motivated this project.</text>

  <!-- header -->
  <text class="mono head" x="72" y="126">TARGET</text>
  <text class="mono head" x="560" y="126">PORT</text>
  <text class="mono head" x="640" y="126">RESULT</text>
  <text class="mono head" x="770" y="126">WHAT IT ACTUALLY PROVES</text>
  <line class="rule" x1="72" y1="136" x2="1128" y2="136"/>

  <!-- row 0 -->
  <text class="mono tgt" x="72" y="176">github.com</text>
  <text class="mono port" x="560" y="176">22</text>
  <rect x="640" y="156" width="92" height="26" rx="5" fill="none" stroke="#b7cc85" stroke-width="1.5"/>
  <text class="mono ok" x="686" y="174" text-anchor="middle">OK</text>
  <text class="sans mean" x="770" y="176">SSH is not blocked as a protocol</text>
  <line class="rule" x1="72" y1="192" x2="1128" y2="192"/>

  <!-- row 1 -->
  <text class="mono tgt" x="72" y="220">ssh.github.com</text>
  <text class="mono port" x="560" y="220">443</text>
  <rect x="640" y="200" width="92" height="26" rx="5" fill="none" stroke="#b7cc85" stroke-width="1.5"/>
  <text class="mono ok" x="686" y="218" text-anchor="middle">OK</text>
  <text class="sans mean" x="770" y="220">SSH-over-443 works when the port is allowed</text>
  <line class="rule" x1="72" y1="236" x2="1128" y2="236"/>

  <!-- row 2 -->
  <text class="mono tgt" x="72" y="264">your hub</text>
  <text class="mono port" x="560" y="264">22</text>
  <rect x="640" y="244" width="92" height="26" rx="5" fill="none" stroke="#cb7c94" stroke-width="1.5"/>
  <text class="mono bad" x="686" y="262" text-anchor="middle">BLOCKED</text>
  <text class="sans mean" x="770" y="264">the block is on the destination</text>
  <line class="rule" x1="72" y1="280" x2="1128" y2="280"/>

  <!-- row 3 -->
  <text class="mono tgt" x="72" y="308">your hub</text>
  <text class="mono port" x="560" y="308">443</text>
  <rect x="640" y="288" width="92" height="26" rx="5" fill="none" stroke="#cb7c94" stroke-width="1.5"/>
  <text class="mono bad" x="686" y="306" text-anchor="middle">BLOCKED</text>
  <text class="sans mean" x="770" y="308">even on 443, so it is not about the port</text>
  <line class="rule" x1="72" y1="324" x2="1128" y2="324"/>

  <!-- row 4 -->
  <text class="mono tgt" x="72" y="352">region1.v2.argotunnel.com</text>
  <text class="mono port" x="560" y="352">7844</text>
  <rect x="640" y="332" width="92" height="26" rx="5" fill="none" stroke="#b7cc85" stroke-width="1.5"/>
  <text class="mono ok" x="686" y="350" text-anchor="middle">OK</text>
  <text class="sans mean" x="770" y="352">the Cloudflare edge is reachable</text>
  <line class="rule" x1="72" y1="368" x2="1128" y2="368"/>

  <!-- row 5 -->
  <text class="mono tgt" x="72" y="396">www.cloudflare.com</text>
  <text class="mono port" x="560" y="396">443</text>
  <rect x="640" y="376" width="92" height="26" rx="5" fill="none" stroke="#b7cc85" stroke-width="1.5"/>
  <text class="mono ok" x="686" y="394" text-anchor="middle">OK</text>
  <text class="sans mean" x="770" y="396">no TLS interception in the path</text>
  <line class="rule" x1="72" y1="412" x2="1128" y2="412"/>

  <!-- conclusion -->
  <rect x="56" y="470" width="1088" height="124" rx="12" fill="#1f2335" stroke="#3b4261" stroke-width="1.5"/>
  <rect x="76" y="490" width="4" height="84" rx="2" fill="#e0c15a"/>
  <text class="mono" x="100" y="516" font-size="21" fill="#e0c15a">SSH works. The destination is blocked.</text>
  <text class="mono" x="100" y="546" font-size="21" fill="#e0c15a">The tunnel edge is reachable.</text>
  <text class="sans" x="100" y="576" font-size="14" fill="#a9b1d6">Every conclusion a human draws from "my corporate network blocks SSH" is wrong.</text>
</svg>
